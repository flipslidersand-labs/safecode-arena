name: Quality

on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/rust-test.yml@main
    with:
      # examples/ に main なしのため --lib --tests のみ対象
      test-args: "--lib --tests"
      clippy-args: "--lib --tests --bins"
      run-coverage: false
      runner: ubuntu-latest
