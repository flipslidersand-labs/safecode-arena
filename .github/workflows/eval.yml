name: safecode evaluate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  pull-requests: write
  contents: read

jobs:
  evaluate:
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (self-hosted runner)
        if: runner.environment == 'self-hosted'
        run: |
          if ! dpkg -l build-essential &>/dev/null 2>&1 || ! command -v cc &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get rustc version
        id: rustc
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.environment }}-cargo-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-cargo-${{ steps.rustc.outputs.version }}-

      - name: Build release binary
        run: cargo build --release

      - name: Evaluate examples (Rust candidates)
        id: evaluate
        run: |
          rm -f /tmp/report.md
          set +e
          ./target/release/safecode evaluate \
            examples/good.rs \
            examples/buggy.rs \
            --format markdown \
            --out /tmp/report.md \
            --db /tmp/safecode.db \
            --regression-threshold 1.0
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Add report to job summary
        run: |
          if [ -f /tmp/report.md ]; then
            { echo "## safecode evaluate 結果"; echo; cat /tmp/report.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> safecode: レポートが生成されませんでした。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # fork PR では GITHUB_TOKEN が read-only のためコメント不可(サマリーのみ)
      - name: Post report as PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('/tmp/report.md', 'utf8');
            } catch {
              body = '> safecode: レポートの生成に失敗しました。';
            }
            const header = '<!-- safecode-eval -->';
            const fullBody = `${header}\n## safecode evaluate 結果\n\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(header));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      # 終了コード 1 は「回帰検出」(process::exit(1))だが、main の anyhow エラーも 1 になる。
      # 回帰判定はレポート出力後に行われるため、code=1 かつレポートあり = 回帰、それ以外は実行エラー。
      - name: Fail on regression or execution error
        env:
          CODE: ${{ steps.evaluate.outputs.code }}
        run: |
          if [ "$CODE" = "0" ]; then
            exit 0
          fi
          if [ "$CODE" = "1" ] && [ -f /tmp/report.md ]; then
            echo "::error::スコアリグレッションが検出されました。ジョブサマリー/PR コメントのレポートを確認してください。"
          elif [ -f /tmp/report.md ]; then
            echo "::error::safecode evaluate が実行エラーで終了しました (exit code ${CODE})。回帰ではありません。ログを確認してください。"
          else
            echo "::error::safecode evaluate が実行エラーで終了し、レポートが生成されませんでした (exit code ${CODE:-unknown})。回帰ではありません。ログを確認してください。"
          fi
          exit 1
