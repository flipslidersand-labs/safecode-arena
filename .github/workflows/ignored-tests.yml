name: ignored-tests

# #108: reusable rust-test.yml は pytest / wasm32-wasip1 を入れられないため、
# #[ignore] 付きの外部ツール依存テストはこの job で --ignored 指定して実行する。

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ignored-tests:
    runs-on: ${{ vars.GATE_RUNNER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies (self-hosted runner)
        if: runner.environment == 'self-hosted'
        run: |
          if ! dpkg -l build-essential &>/dev/null 2>&1 || ! command -v cc &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential
          fi

      - name: Install Rust toolchain (wasm32-wasip1)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - name: Get rustc version
        id: rustc
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Install pytest and ruff
        run: python3 -m pip install --user pytest ruff && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.environment }}-cargo-ignored-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.environment }}-cargo-ignored-${{ steps.rustc.outputs.version }}-

      - name: Run ignored tests
        run: cargo test --test evaluate -- --ignored
